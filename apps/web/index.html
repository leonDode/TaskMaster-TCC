<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Master</title>
    <script>
      // Applies the persisted theme before first paint, avoiding a flash of
      // the wrong theme. `<html class="dark">` above is the fallback for
      // first visit / JS-disabled — dark is the app's normal/default mode.
      (function () {
        try {
          var stored = localStorage.getItem('task-master:theme');
          var theme = stored ? JSON.parse(stored).state.theme : 'dark';
          document.documentElement.classList.toggle('dark', theme !== 'light');
        } catch {
          // Keep the default `dark` class from the markup above.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
